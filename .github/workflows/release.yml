# ERD §15.4 — desktop release pipeline.
#
# Trigger: push a tag matching `v*` (e.g. `v0.9.0`). Tauri Action then
# builds + signs + uploads platform installers to a GitHub Release,
# producing `latest.json` so the in-app updater can pick it up.
#
# Required GitHub Secrets:
#
#   TAURI_SIGNING_PRIVATE_KEY           — contents of ~/.dayrail/tauri-updater.key
#                                         (raw text, no quoting)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — the passphrase set when generating the key
#   GOOGLE_DESKTOP_CLIENT_ID            — OAuth client ID, "Desktop app" type, from Google Cloud Console
#   GOOGLE_DESKTOP_CLIENT_SECRET        — matching client secret (per RFC 8252 not actually
#                                         confidential, but Google's flow still requires it)
#
# Optional Secrets (macOS code signing + notarization, once Apple
# Developer enrollment completes — currently the workflow ships
# unsigned macOS .app, see ERD §15.5):
#
#   APPLE_CERTIFICATE                   — base64 of .p12 export of Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD          — .p12 passphrase
#   APPLE_SIGNING_IDENTITY              — "Developer ID Application: <name> (<team>)"
#   APPLE_ID                            — Apple ID email
#   APPLE_PASSWORD                      — app-specific password
#   APPLE_TEAM_ID                       — 10-char Apple Team ID

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both arm64 + x86_64 targets; matrix splits the build.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build web bundle
        run: pnpm --filter @dayrail/web build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — REQUIRED. Without these, the
          # `latest.json` won't be produced and auto-update is broken.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Drive OAuth — REQUIRED. `option_env!()` in
          # apps/desktop/src-tauri/src/drive_auth.rs reads these at
          # compile time. Locally they come from `apps/desktop/src-tauri/.env`
          # (forwarded by build.rs); in CI we set them as process env
          # so cargo / rustc / `option_env!` see them directly.
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          # macOS code signing + notarization — OPTIONAL. Skipped when
          # the secrets aren't set (yields an unsigned .app that
          # Gatekeeper warns on; users right-click → Open once).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'DayRail ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG / ERD History for what changed.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # `latest.json` is auto-generated by tauri-action when the
          # updater is enabled in tauri.conf.json. The file is uploaded
          # to the release as `latest.json` and is what `plugins.updater.endpoints`
          # in tauri.conf.json points at via the `releases/latest/download/`
          # GitHub redirect.
          updaterJsonKeepUniversal: false
