[package]
name = "dayrail-desktop"
version = "0.0.0"
description = "DayRail desktop shell"
authors = ["FreeJolan"]
edition = "2021"
rust-version = "1.77"

# Tauri 2 splits the runtime into a `lib` (so the same code can be
# reused on mobile entry points later) plus a tiny `main.rs` shim.
# We don't ship mobile in v0.9 (see ERD §15.7), but the lib/bin split
# is the upstream-recommended layout regardless.
[lib]
name = "dayrail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# ERD §15.4 — auto-update via tauri-plugin-updater. Pulls signed
# bundles from a static manifest URL (GitHub Releases). The
# corresponding minisign keypair lives outside the repo
# (~/.dayrail/tauri-updater.key); only the public key is committed
# (in tauri.conf.json under plugins.updater.pubkey).
tauri-plugin-updater = "2"
# `tauri-plugin-process` exposes `relaunch()` to the frontend so the
# updater UX can restart cleanly after install completes.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ERD §15.3 — desktop OAuth pattern for Drive sync.
# `oauth2` runs the auth-code + PKCE + refresh exchange against
# Google's token endpoint. `keyring` persists the refresh token in
# the OS keychain (Keychain Services on macOS / Credential Manager
# on Windows / Secret Service on Linux). `tokio` is already pulled
# transitively by Tauri.
oauth2 = "5"
keyring = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
urlencoding = "2"
# `open` opens the OAuth consent URL in the user's default browser
# without going through tauri-plugin-shell IPC (we're invoking from
# Rust side, no need for the capability + frontend round-trip).
open = "5"
tokio = { version = "1", features = ["net", "io-util", "macros", "time"] }

# Profile tweaks for release builds — small binary + faster crash
# reports. v0.9 starts with defaults; we'll tune after PR-B if the
# bundle size or stripped-symbol output matters.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
